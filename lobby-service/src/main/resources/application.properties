spring.application.name=lobby-service
server.port=8083
spring.grpc.server.port=9091

spring.datasource.url=jdbc:postgresql://localhost:5433/matchmaking?TimeZone=Asia/Kolkata
spring.datasource.username=gameuser
spring.datasource.password=gamepass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
